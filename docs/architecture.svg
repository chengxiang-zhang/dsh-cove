<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img"
     aria-label="dsh-cove architecture: one entity plugin inside the DSH web profile, reached from a local browser, a remote overlay entry, a desktop app and mobile clients">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7f"/>
    </marker>
    <style>
      .lane   { fill: #f6f8fb; stroke: #d9e1ea; stroke-width: 1; rx: 10; }
      .box    { fill: #ffffff; stroke: #b9c6d6; stroke-width: 1.2; rx: 8; }
      .core   { fill: #eaf1fb; stroke: #7fa3cf; stroke-width: 1.2; rx: 8; }
      .entity { fill: #eef7f0; stroke: #78a986; stroke-width: 1.6; rx: 8; }
      .client { fill: #fdf6ea; stroke: #cda86a; stroke-width: 1.2; rx: 8; }
      .label  { font-family: -apple-system, "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #22303f; }
      .title  { font-size: 15px; font-weight: 600; }
      .body   { font-size: 12px; }
      .small  { font-size: 11px; fill: #5b6b7f; }
      .lane-title { font-size: 12px; font-weight: 600; fill: #5b6b7f; letter-spacing: .04em; }
      .edge   { stroke: #5b6b7f; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .edge-label { font-size: 10.5px; fill: #5b6b7f; }
    </style>
  </defs>

  <rect width="980" height="600" fill="#ffffff"/>

  <!-- DSH runtime -->
  <rect class="lane" x="20" y="20" width="640" height="150"/>
  <text class="label lane-title" x="36" y="42">DSH RUNTIME</text>

  <rect class="core" x="36" y="56" width="250" height="98"/>
  <text class="label title" x="50" y="80">dsh CLI</text>
  <text class="label body" x="50" y="100">profiles, plugin management,</text>
  <text class="label body" x="50" y="118">session persistence, tools</text>
  <text class="label small" x="50" y="140">@deepseek-ai/dsh</text>

  <rect class="box" x="306" y="56" width="330" height="98"/>
  <text class="label title" x="320" y="80">web profile</text>
  <text class="label body" x="320" y="100">@deepseek-ai/dsh-base</text>
  <text class="label body" x="320" y="118">@deepseek-ai/dsh-web-app</text>
  <text class="label body" x="320" y="136">@dsh-cove/dsh-web-all &#8592; one entity row</text>

  <!-- dsh-cove entity -->
  <rect class="lane" x="20" y="190" width="640" height="250"/>
  <text class="label lane-title" x="36" y="212">dsh-cove &#183; web-all (single Cordis lifecycle)</text>

  <rect class="entity" x="36" y="228" width="196" height="196"/>
  <text class="label title" x="50" y="252">host services</text>
  <text class="label body" x="50" y="276">SSH &#183; terminal &#183; transfer</text>
  <text class="label body" x="50" y="296">tunnels &#183; cluster exec</text>
  <text class="label body" x="50" y="316">web authentication</text>
  <text class="label body" x="50" y="336">finished-turn notifications</text>
  <text class="label body" x="50" y="356">Playwright browsers</text>
  <text class="label body" x="50" y="376">Feishu inbox</text>
  <text class="label body" x="50" y="396">Codex bridge</text>

  <rect class="entity" x="248" y="228" width="196" height="196"/>
  <text class="label title" x="262" y="252">client sections</text>
  <text class="label body" x="262" y="276">sidebar + settings</text>
  <text class="label body" x="262" y="296">Git workbench</text>
  <text class="label body" x="262" y="316">branch chip &#183; graph</text>
  <text class="label body" x="262" y="336">memory panel</text>
  <text class="label body" x="262" y="356">notifications feed</text>

  <rect class="box" x="460" y="228" width="176" height="196"/>
  <text class="label title" x="474" y="252">presets</text>
  <text class="label body" x="474" y="276">code-vibe</text>
  <text class="label small" x="474" y="294">wish programming</text>
  <text class="label body" x="474" y="320">hiopen</text>
  <text class="label small" x="474" y="338">bring your own</text>
  <text class="label small" x="474" y="354">OpenAI-compatible</text>
  <text class="label small" x="474" y="370">endpoint</text>

  <!-- access plane -->
  <rect class="lane" x="680" y="20" width="280" height="250"/>
  <text class="label lane-title" x="696" y="42">ACCESS</text>

  <rect class="client" x="696" y="58" width="248" height="52"/>
  <text class="label title" x="710" y="79">local browser</text>
  <text class="label small" x="710" y="97">127.0.0.1:3080</text>

  <rect class="client" x="696" y="122" width="248" height="66"/>
  <text class="label title" x="710" y="143">remote entry</text>
  <text class="label small" x="710" y="161">http://dsh.&lt;machine&gt;.netbird</text>
  <text class="label small" x="710" y="177">trusted-host fence &#183; session auth</text>

  <rect class="client" x="696" y="200" width="118" height="56"/>
  <text class="label title" x="710" y="221">desktop</text>
  <text class="label small" x="710" y="239">Anywhere Work</text>
  <text class="label small" x="710" y="253">resident view</text>

  <rect class="client" x="826" y="200" width="118" height="56"/>
  <text class="label title" x="840" y="221">mobile</text>
  <text class="label small" x="840" y="239">Android &#183; iOS build</text>
  <text class="label small" x="840" y="253">iOS not distributed</text>

  <!-- edges -->
  <path class="edge" d="M 286 105 L 306 105"/>
  <path class="edge" d="M 471 154 L 471 228"/>
  <path class="edge" d="M 820 110 L 820 122"/>
  <path class="edge" d="M 780 188 L 780 200"/>
  <path class="edge" d="M 860 188 L 880 200"/>

  <!-- bottom note -->
  <text class="label small" x="20" y="470">Everything above lives in one package: mounting @dsh-cove/dsh-web-all adds one entity row and its patch rows, without touching DSH source.</text>
  <text class="label small" x="20" y="492">Machine values (control-plane address, STUN endpoint, model route) live outside the repository and are supplied at build time from config/.</text>
  <text class="label small" x="20" y="514">Remote access requires an overlay network; the local browser entry needs none.</text>
</svg>
