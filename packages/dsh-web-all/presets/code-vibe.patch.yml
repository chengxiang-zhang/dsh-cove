# Bundled `code-vibe` preset for DSH 0.2: the "wish programming" mode.
#
# GENERATED FILE — do not edit. The composition below is copied verbatim from
# presets/code-vibe/agent.cordis.yml and the roster metadata from
# presets/code-vibe/preset.yml; regenerate with `node scripts/render-preset.mjs`
# and let `--check` guard the pair in CI.
#
# The composition is an AGENT-PLANE list: every row belongs to the session that
# mounts this preset, and the host composition (base + web bundles) keeps the
# registries, sandbox, approvals and model route. The rendered rows and the skill
# assets behind them resolve from the installed package root through `!!js`
# expressions, so a profile needs no copy of either.
- insert:
    - id: preset-code-vibe
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: code-vibe
        name: "许愿式编程"
        description: "按任务大小分档（T0 回答 / T1 修 / T2 改 / T3 agent loop / 调研 / 事故）的编码 agent 预设；小任务快、中任务稳、大任务才开环。含原话锚定、统一工件与证据阶梯、发布轨（P0–P6 + release_check 机械门）、上下文与压缩韧性、Agent Team 长跑协议与评测套件。"
        order: 5
        plugins:
          # The `code-vibe` agent preset (许愿式编程 / wish programming): the standard
          # coding tool set presented NATIVELY — the model sees every tool schema and
          # calls tools one per action, NOT Code Mode's `run_code` program transport.
          #
          # The `tool-presentation` row below pins `mode: native` so this agent never
          # inherits a deployment-wide `code`/`both` default. (The shipped `code` preset
          # is the Code Mode variant; this preset is the native variant, with the
          # wish-programming persona and skill layered on top.)
          #
          # The registry itself stays on the host plane — the agent loop's scheduler and
          # the API proxy's presenters are its consumers — so what this preset owns is
          # the PRESENTATION of that registry for this agent alone. Code Mode sessions
          # run beside this native one in the same process, each seeing its own catalog.
          #
          # This file is an AGENT-PLANE composition. It is mounted under one agent's
          # scope context, so every tool and prompt section it registers belongs to that
          # session alone. The host composition (`base.cordis.yml` + `web.cordis.yml`)
          # keeps everything a preset must not own: the registries themselves, the
          # sandbox and approval stack, persistence, and the model route.
          #
          # A service row here MUST sit inside a group carrying an `isolate` realm.
          # Without one it publishes into the root realm, where it is process-global
          # rather than per-session and the second session mounting this preset collides
          # with the first; `dsh-agent-presets` rejects that at mount. `true` means an
          # entry-local realm — one private instance per mounted session, which is the
          # default this deployment wants. A shared label would instead pool one instance
          # across every session naming it.

          # ── identity ────────────────────────────────────────────────────────────────

          # The preset's own persona, shadowing the deployment default for this agent.
          # `{{model}}` resolves from the agent's own route. DSH 0.2.1 dropped the `cwd`
          # variable (its registry is provider/model only) and throws on unknown groups, so the
          # working directory is described in prose instead of being interpolated.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              # 0.1.6-alpha.1: field renamed text → prefix (required)
              suffix: Your working directory is the session workspace root; confirm it with pwd before writing files relative to it.
              prefix: |-
                You are a wish-programming coding agent powered by the {{model}} model. You are the FRONT-DESK PM: the user only talks to you; answer in user language and never dump internal artifacts (product.md / arch.md / review-*.md) or engineering vocabulary without a plain-language line. Keep four things resident: 需求原文 / 确认结论 / 语义不变量（含 Out-of-scope）/ 模块进度摘要; everything else lives on disk.

                TASK CLASS: every request is either an ANSWER (a question, analysis, review — answer it, do not start building) or a DELIVERY (a change with evidence). For a DELIVERY load `task-router`, pick the smallest tier that fits, declare it in two lines (tier · artifacts&gates), and re-check at milestones. Do not run a heavy flow for a small request and do not skip the gate for a delivery; the user's one phrase re-tiers it (直接做 / 简单点 / 按程序来).

                CORE RULES (six, must survive compaction):
                1. 原话最高：record the user's words verbatim in `docs/wish/<id>/quote.md`; downstream may quote and interpret, never replace; on conflict the original wins and the conflict goes back to the user. The order also fixes the deliverable: build the artifact it names, at the scope it names — an assessment / test / 读者测试 order is read-only, a "complete conclusion" covers every entry the user named instead of a menu or a fragment, and anything beyond that is a separate order the user has to give (2026-11-13: a 读者测试 order edited 9 files; a 总体结论 request was answered with 二选一).
                2. 证据分档：code-ready = a green gate; dev-effective = a real browser run on the dev instance (render + click; screenshots alone are not a run); production-delivered = a production readback. API/DB/health readings never upgrade a verdict; every conclusion names what ran and lists the required checks that did not.
                3. 三道机械门（其余都是建议，不是法律）：上线/发布/「能上线了吗」→ load `release-gate`, run `release_check.py`, paste its table — a prose verdict is not an answer; UI 验收 → `.sdd/acceptance/<id>/e2e/{steps.md,run.log,≥1 截图}`, `check_spec --close` / `verify.sh` refuse without it; 上线/收尾回合 → `turn-contract` steers you when the gate has not run.
                4. 问答优先：a question turn is answered in the first message, ≤3 sentences, before the first tool call, and makes no write the answer does not require. A progress report never replaces the answer.
                5. 只问用户价值：technical decisions (reversible build/merge/push/config choice/cleanup of what the user names/file-format) are yours — take the reversible default, record it, keep going. Ask once only for a user-value trade-off or a fact only the user has; never ask to confirm work you can do; never end a turn with only "next I will…"; never mark a goal blocked while another slice can advance; a goal is not a round budget (omit max_goal_rounds).
                6. 关条靠自己门：done means the item's own gate ran and the reading is pasted — print 开放N / 阻塞B / 已关C / 本轮真关D; unrun checks stay 未验收 with the check named; the headline of every report is a user-perceivable capability, not a process count. State lives on disk (STATE / tasks / handoff): after any compaction read it first, never continue from the summary.

                PATHS (details in the skills): 产品愿望 → `wish-programming` (T2-wish 短路径 / T3-wish 全路径); 小修 → `fix-loop`; 后端/数据/运维 → `change-spec`; 多模块 program → `large-backlog-program` + `agent-team-project-loop`; 调研 → `research-brief`; 事故 → `incident-runbook`; 容量 → `measurement-evidence`; 完成判定 → `ledger-close-not-construction-done`; 上线判定 → `release-gate`; 设计请求 → `design-orchestrator`; 同仓多写任务 → `lane-worktree` (its tool `scripts/dsh-lane.sh` ships in the PRESET dir — resolve it as `<preset-root>/scripts/dsh-lane.sh`; read-only work never takes a lane).

                DELEGATION: keep 需求理解 / 设计决策 / 产品判断 in your context; subagents get work that no longer depends on it — mechanical implementation against a frozen spec, independent acceptance with fresh context, parallel read-only research. Every brief carries the spec reference, component whitelist (禁发明), 原话对照 and a user-perspective line; maker ≠ grader (deny write tools to the verifier); an AI verdict never replaces a real render or the user's judgement. Model routing: native `subagent` / `subagent_fork` inherit this session; the external tools take `model` only — `subagent_codex` (default `gpt-6-astra`) and `subagent_claude_code` (`kaon/claude-sonnet-5-5` | `kaon/claude-opus-5-5` | `kaon/claude-haiku-5-5`); switching family means switching tool, never a `provider` argument. `workflow` only when the user asks.

                WORKSPACE: the selected workspace is the only authorized product target; if unrelated, ask one question and stop.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── time context ────────────────────────────────────────────────────────────

          # Opt-in per-step clock context. Backs the wish-programming timebox rule and
          # the journey UPDATED_AT claims with a real sampled clock plus an elapsed-time
          # baseline, instead of the model guessing wall time. Throttled to one injection
          # per 60s so long runs do not pay a context message on every step; the browser
          # zone is used when one unique zone is attached to the request, else the Node
          # process zone. Remove this row to drop the added tokens entirely.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
            config:
              refreshIntervalMs: 60000

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane:
          # its producers sit outside any realm this file could put it in — `tool-bash`
          # above resolves it with `ctx.get`, and an entry-local realm here is invisible
          # to every sibling row, so `run_in_background` would answer "background jobs
          # unavailable" while these controls sat in the catalog. The registry is keyed by
          # owning agent anyway, so one host instance serves every session. What a preset
          # chooses is whether its agent can collect and stop background work at all.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset, and
          # `tool-skill` gives them the catalog and loader; the merged catalog also
          # carries whatever the deployment registered globally (repository plugins).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@dsh-cove/dsh-web-all/package.json')), 'presets/code-vibe/skills')"

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
            config:
              catalogDescriptionMaxLength: 300

          # ── goals ───────────────────────────────────────────────────────────────────

          # Only the model-facing tool. The goal SERVICE, its session driver, and the
          # `/goal` command stay on the host plane: the Gateway serves the goal domain as
          # Remote endpoints whose receiver comes from a generated descriptor, so it
          # resolves `goals` on the host and an entry-local realm here would hide it. The
          # registry is keyed by session anyway, so one host instance serves every
          # session. What a preset chooses is whether its agent can call the goal tool.
          # The goal registry stays on the host plane; this preset contributes the human
          # command and the model-facing tool for agents that choose this mode. The command
          # row is kept from the bundled preset: the 0.2 contract pairs `/goal` with the
          # tool, and the v5 composition only carried the tool half.
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
          # share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance. It takes no configuration,
          # keys every fold by Session, and owns the context-meter projection units the
          # browser reads for every session — behind a realm those units would come and go
          # with whichever presets happen to be mounted. What a preset chooses is whether
          # its agent compacts at all, which is `compaction-basic` below.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  # v5：早压 + 保留最近工作集 + 摘要上限；计划内换会话/压缩在 40–50%，这里只是紧急刹车
                  thresholdRatio: 0.75
                  retainTokens: 24576
                  maxTokens: 8192

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  # v5：默认 8192 太早裁掉证据，放宽但保留尾读
                  thresholdChars: 32768
                  headChars: 8192
                  tailChars: 2048

          # ── delegation and workflows ────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition: the registry is a process singleton whose cross-session queries
          # the api-proxy serves to the browser, and a provider name may only be
          # registered once. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # `workflows` is different — nothing outside an agent reads it — so every row
          # that reaches it shares one entry-local realm here, and a consumer left
          # outside would resolve a host registry this preset does not populate.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              # DISABLED 2026-09-03 (revert to DSH default): this local plugin replaced the
              # harness-hardcoded `tool:workflow` prompt section (order 115, "ONLY when the
              # user explicitly asks") with a fan-out-encouraging replacement (">=2
              # independent sub-tasks -> parallel subagents; >=3 -> workflow fan-out; never
              # execute serially"). Root-cause analysis of the 2026-09-03 subagent explosion
              # (one root session spawning a 1255-session / 24-deep delegation tree in the
              # kaon-code-repositories workspace) showed the plugin's text inherited by every
              # workflow child agent drove unbounded recursive fan-out. The fix is to restore
              # the harness default: `workflow` is used only when the user explicitly asks.
              # Keep the plugin file for rollback/audit; do not re-enable without a runtime
              # delegation guard (depth cap / leaf-agent tool filter) in place.
              # - id: delegation-policy
              #   name: './plugins/delegation-policy-v4.js'

              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              # Fork MUST stay one-shot (aligned with the base bundle and the
              # `fork-children-stay-one-shot` decision): fork's only payoff over spawn is
              # request-prefix reuse of the seeded parent history. A continuable fork
              # installs the child-scoped `report` tool + `tool:report` section in the
              # request head, ahead of the inherited history, so reuse breaks before the
              # first inherited turn and the child pays the duplication for nothing.
              # Long-lived children that need no inherited context use `subagent` (spawn)
              # above, which is continuable.
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: one-shot

              # External CLI delegation (external-session) is mounted at the Loader plane by
              # the profile's own rows, not here. A preset row instantiates the plugin outside
              # the Loader, and HMR can only replace modules whose every live importer is a
              # Loader entry: with these rows present, any change to the tool module forced a
              # restart instead of hot-swapping.

              # 0.1.6-alpha.1 dropped @deepseek-ai/dsh-workflow-worker-thread from the
              # shipped CLI tree (last published was 0.1.5-rc.2). Stock presets now use
              # workflow-ptc; keep provider: spawn aligned with standard/agent.cordis.yml.
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── launch/close turn contract ───────────────────────────────────────────────

          # One runtime rule, narrowly scoped: when the user's OWN message is a
          # launch-readiness or close-out question and the turn has not executed
          # release_check.py, the turn is steered once with the exact command, so the answer
          # becomes a gate table instead of a prose debt list (observed live 2026-11-08:
          # 「具备全量上线的条件了吗」 answered with 生产还在跑旧代码 / 没有回滚演练).
          #
          # It never denies a tool, never claims a checkout, never writes into a user
          # repository and never asks the user a question — the four reasons the old
          # wish-gate plugin was removed (2026-11-02), all of them out of scope here.
          # Module code is ESM-cached per process: this row and the module become live only
          # after the profile is reassembled (restart). Kill switch: TURN_CONTRACT_STEER=0.
          - id: turn-contract
            name: '@dsh-cove/dsh-web-all/presets/code-vibe/plugins/turn-contract.js'
            config: {}

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # Cross-session memory search (opt-in). The `sessionQuery` service is host-plane
          # (base's `session-query-sqlite`); these five read-only tools let the conductor
          # find prior wishes, decisions, and acceptance evidence across sessions in the
          # same workspace. Requires the host to enable FTS (`session-query-sqlite`
          # `openAt: first-search`) — done in the web profile patch.
          # `present` keeps the file-card delivery tool that the web UI renders; v5's
          # rewrite dropped the row while its flow skills still hand the user files.
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          - id: tool-presentation
            name: '@deepseek-ai/dsh-agent-tool-presentation'
            config:
              mode: native
