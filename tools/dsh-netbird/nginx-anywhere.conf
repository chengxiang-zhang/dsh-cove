# anywhere.example.com - the official site, the client channel and the
# roadshow deck, on one name.
#
# Owner: scripts/dsh-netbird-client-publish.mjs installs and refreshes this file
# (the client channel's publish owns the name, because the site and the update
# channel share it). The roadshow deck owns one marked region inside it - the
# `deck (anywhere work roadshow)` block - which the deck deploy script
# replaces by marker and leaves everything else alone.
#
# What lives on this name, and where:
#   1. The official site owns the root: `/` serves
#      /www/wwwroot/client/index.html, and the page's own asset (qr-phone.svg)
#      is served from the same published directory at /qr-phone.svg, because a
#      relative `src` on a page served at `/` resolves to the root. `/client/`
#      used to be the page's address; it now 301s to the root so links shared
#      before the move keep working while the canonical address is the root.
#   2. The client channel (the reason this domain exists - the Android app has
#      this host compiled in as its bootstrap address, see
#      tools/netbird-client/src/fleetConfig.ts). Its endpoints must all keep
#      answering: /health, /version.json, /fleet.json, /install.sh, the APK, and
#      the /client/ archives (latest.txt, management-url.txt, checksums.txt,
#      netbird_*.tar.gz). Those live under /client/ and are not part of the
#      site; only the page moved up.
#   3. The roadshow deck, one of the site's entries, at /deck/ (published by
#      deploy.mjs into /www/wwwroot/deck). It is self-contained, so it plays
#      with the network unplugged.
#
# TLS: the Let's Encrypt certificate for apk.example.com already carries
# anywhere.example.com in its SAN list, which is why one certificate
# covers both names (see /etc/letsencrypt/renewal).

server {
    listen 80;
    listen [::]:80;
    server_name anywhere.example.com;

    access_log /www/wwwlogs/anywhere.log;
    error_log  /www/wwwlogs/anywhere.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/netbird-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name anywhere.example.com;

    ssl_certificate     /etc/letsencrypt/live/apk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apk.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /www/wwwlogs/anywhere.log;
    error_log  /www/wwwlogs/anywhere.error.log;

    # The update channel's own files (the APK, version.json, fleet.json) are
    # served from here; the site's page and its asset come from the client
    # channel's published root, below.
    root /www/wwwroot/apk;

    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }

    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
    }

    location = /fleet.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin *;
    }

    location = /install.sh {
        root /www/wwwroot/client;
        default_type text/x-shellscript;
        add_header Cache-Control "no-store";
    }

    # The Windows installer, served the same way the POSIX one is: PowerShell reads
    # it as text (`iwr ... | iex`), so the type is plain and the cache stays off.
    location = /install.ps1 {
        root /www/wwwroot/client;
        default_type text/plain;
        add_header Cache-Control "no-store";
    }

    # --- the official site: root page plus the one asset it loads ------------
    # Served straight out of the published channel root, so the page and
    # install.sh are always swapped in by the same atomic publish.
    location = / {
        root /www/wwwroot/client;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /qr-phone.svg {
        root /www/wwwroot/client;
        add_header Cache-Control "public, max-age=3600";
    }

    # The page lived one level down before; keep those links alive and point
    # them at the canonical root instead of serving the same document twice.
    location = /client/ {
        return 301 https://$host/;
    }

    location = /client/index.html {
        return 301 https://$host/;
    }

    # --- the client channel: archives and generated text files ---------------
    location /client/ {
        root /www/wwwroot;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/client/netbird_[^/]*\.tar\.gz$ {
        root /www/wwwroot;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

# --- deck (anywhere work roadshow) begin ---
    # Roadshow deck. Published by the deck deploy script into
    # /www/wwwroot/deck; only this marked region belongs to that script. The rest
    # of this vhost (the landing page at the root, /health, /version.json,
    # /fleet.json, /install.sh, the /client/ redirect) belongs to the
    # client-channel work and is left alone.
    #
    # /deck/ -> /www/wwwroot/deck/{index.html,anywhere-work-deck.pdf,audition/}
    location ^~ /deck/ {
        root /www/wwwroot;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
    }
    # --- deck (anywhere work roadshow) end ---

    location / {
        try_files $uri $uri/ =404;
    }
}