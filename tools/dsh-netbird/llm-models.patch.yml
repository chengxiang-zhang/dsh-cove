# NetBird DSH 预置模型接入配置（全机器统一事实源，秘钥一律不进本文件）。
# 来源：laptop-b 的 router 实测目录（工具调用 / 图片输入 / 最大输出 / 推理档位逐项验证）
# 合并 studio-mac 的 dsh-api-proxy（codex 订阅 auth2api）本机代理。
#
# 用法：把下面两个条目合并进每台机器的 $DSH_HOME/profiles/web/cordis.patch.yml：
#   1. llm-pi-ai 行 —— 把 providers 下的 router / codex-local / hiopen 整块并入该机器
#      既有的唯一 llm-pi-ai 行（同名 provider 整块替换，机器本地模型目录删除）；
#   2. agent-default-model 行 —— 直接替换。
# 外部编辑 profile 需重启 dsh web 生效；运行中的 configEditor 会用内存状态回写 profile 文件，
# 因此先在 Web 界面停止相关编辑，合并后由机器管理员重启服务。
#
# 秘钥契约（fail-closed；禁止写进本文件 / machines.json / 文档 / 服务单元）：
#   - router: $DSH_HOME/.credentials.yaml 的 refs.KAON_ROUTER_API_KEY
#   - codex-local: refs.DSH_API_PROXY_KEY，值与本机 dsh-api-proxy config.yaml 的 apiKeys 条目一致
#   - hiopen: refs.HIOPEN_API_KEY（端点由 config/deployment.local.json 提供）
#   秘钥文件保持 0600 且仅 owner 可读；未配置秘钥只让对应 provider 请求失败，不影响 dsh web 启动。
#
# 2026-10-09 移除的 hiopen 模型（上游把思考混进 content 流而非 reasoning_content 字段，
# pi-ai 无法剥离，思考文本与 <calls> 工具调用计划会泄漏进正文；实测排查确认，与 DSH 无关）：
#   - deepseek-v4.1-flash（无前缀 alternate 路由 → 实际路由 agnes-3.0-flash）
#   - MiniMax-M3 / MiniMax-M2.7-highspeed（thinking-as-text 混 content）
# 保留 deepseek-ai/deepseek-v4.1-flash（带前缀路由 reasoning 正常）。
#
# router 实测事实（laptop-b 迁移 + 2026-10-08 studio-mac 全量复核）：
# - contextWindow 不能信端点自报（/v1/models 的 context_length 两个方向都会错）：
#   虚高如 claude-fable-5 自报 10240000（实测 200k 档）、claude-haiku-4-5 上游明确报 200000；
#   低估如 gpt-5.6 系自报 128000（实测 ≥545619）。以下数值按逐模型探针结果维护，
#   已验证通过的样本见各模型行内注释；未经长文验证的模型保持保守值。
#   DSH 用 contextWindow 判断上下文溢出与压缩时机：超声明会在会话中途被打断（400/content_filter），
#   低声明只会提前压缩（安全但浪费），所以宁可低估。
# - reasoningEfforts 的 off 会被 pi-ai 转成「不发送 reasoning_effort」，即跟随上游默认；
#   该路由拒绝 none/minimal（400），glm-5.3 系另拒 medium（上游要求 low/high/max），
#   且 Claude/Grok 等强制思考，所以「关闭」不等于真正关掉思考。
# - DeepSeek 官方 OpenAI 格式 reasoning_effort 支持 low/high/max（medium 会被映射成 high，
#   见 api-docs.deepseek.com/guides/thinking_mode），所以 kaon/deepseek-* 目录补了 max 档；
#   2026-10-09 按官方文档核入，未经该路由逐档探针复核。
# - 声明了 reasoningEfforts 后，pi-ai 会把系统提示改成 role: developer；router 上游只接受
#   system/assistant/user/tool/function，必须保持 supportsDeveloperRole: false。
# - 输入模态不能信端点自报（49 个模型无一报 image）：2026-10-08 用纯色 PNG/JPEG 双重复核，
#   deepseek-v3.2/v4-flash/v4-pro、glm-5、glm-5.2、gpt-6-luna、exclusive-marking-dpsk
#   「收图但失明」（随机报颜色），已降为纯文本；gpt-6.1-sol 实际看得到图，已补 image。
# - 上游取多模态文件的偶发超时（DashScope 侧 "Download multimodal file timed out"）：
#   每次请求都会重发历史里的全部图片，整包越大越容易踩到上游取件时限（实测单图 650KB 约 6s、
#   3.2MB 约 45s）。2026-10-15 复核：会话 a299ca5d 第 14/15 轮各失败一次，失败时历史里 20 张图
#   （2.15MB 原始、约 2.9MB base64），请求在途 63s 后被上游 400 拒绝；同一份历史随后又能成功，
#   说明这是卡在时限边缘而非固定拒绝。DSH 只在整包 base64 超过 maxRequestImageBytes 时才会触发
#   image offload（最旧的图换成文字占位后重试，不消耗 provider 重试预算），所以该上限必须明显低于
#   上游时限对应的大小，否则这层保护永不触发：按 22s/MB 取值 1MiB（约 22s，约 2.7 倍余量）。
#   用 DSH 的 requiredImageOffload 复核该会话的 20 张图：8MiB 下卸载 0 张、整包 2.87MiB（≈63s，
#   正是实测在途时长）；1MiB 下卸载最旧 14 张、只剩 6 张 0.92MiB（≈20s）。
#   单图上限保持 512KiB（若扫描件小字变糊，把 requestImageMaxBytes 调回 1048576）。
#
# codex-local：每台机器自跑一份 dsh-api-proxy（本仓库 tools/dsh-api-proxy），监听
# 127.0.0.1:8317，用各自 ChatGPT 订阅执行 --login --provider=codex 登录（仅本机个人使用）。
# 没有代理的机器保留本 provider 块也不会阻塞启动，只是该 provider 不可用。
# 2026-10-09：上游按 CLI 版本门控模型可见性 —— 0.147.0 只见 gpt-5.6 系，>= 0.162.0
# （最新 @openai/codex）额外解锁 gpt-6.1-sol / gpt-6-astra / gpt-6-sol / gpt-6-luna。
# 因此代理默认 cli-version 已升到 0.162.0，目录补入上述 4 个 gpt-6 模型（保守窗口值，
# 未做逐模型长文探针；codex 上游 /codex/models 不返回窗口，沿用 400000/32768 档）。

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      router:
        displayName: Kaon Router
        apiKeyEnv: KAON_ROUTER_API_KEY
        api: openai-completions
        baseURL: https://router.example.com/v1
        # 声明了 reasoningEfforts 后，pi-ai 会把系统提示改成 role: developer。
        # router 上游只接受 system/assistant/user/tool/function，必须关掉。
        compat:
          supportsDeveloperRole: false
        # 上游取多模态文件的偶发超时（DashScope 侧 "Download multimodal file timed out"）：
        # 每次请求都会重发历史里的全部图片，整包越大越容易踩到超时线
        # （实测该路由上单图 650KB 约 6s、3.2MB 要约 45s，20 张/2.15MB 实测在途 63s 后 400）。
        # 整包上限同时是 image offload 的触发线：只有超限才会把最旧的图换成文字占位并重试，
        # 所以它必须明显低于上游时限对应的大小，否则保护永不触发。单图上限保持 512KiB。
        # 若扫描件小字变糊，把 requestImageMaxBytes 调回 1048576。
        requestImageMaxBytes: 524288
        maxRequestImageBytes: 1048576
        models:
          - id: kaon/claude-fable-5
            name: kaon/claude-fable-5
            # 2026-10-08 实测：~187k 通过，~291k content_filter（真实窗口 200k 档，端点自报 10240000 虚高）
            contextWindow: 180000
            maxTokens: 61929
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: "low"
              medium: "medium"
              high: "high"
          - id: kaon/claude-haiku-4-5-20251001
            name: kaon/claude-haiku-4-5-20251001
            # 2026-10-08 实测：546k 请求被上游明确拒绝「maximum context length is 200000 tokens」
