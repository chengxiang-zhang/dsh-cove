<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 231 40" width="231" height="40" role="img" aria-label="Anywhere Work">
  <!--
    Replaces the vendor wordmark, which the console loads as an <img> from a
    hashed path. The mark is drawn from the product icon; the wordmark is set
    with textLength so it occupies the same width whatever font the viewer's
    browser resolves, and its fill follows the OS colour scheme because an SVG
    inside an <img> is its own document and cannot inherit the page's colour.
  -->
  <style>
    .word { fill: #0F1B2D; }
    @media (prefers-color-scheme: dark) { .word { fill: #E9EFF8; } }
  </style>
  <g transform="translate(1 2)">
    <circle cx="18" cy="18" r="13" fill="none" stroke="#2563EB" stroke-width="7"
            stroke-linecap="round" stroke-dasharray="64 20" transform="rotate(-45 18 18)"/>
    <circle cx="28" cy="8" r="6" fill="#22D3EE"/>
  </g>
  <text class="word" x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="21" font-weight="600" letter-spacing="-0.4"
        textLength="180" lengthAdjust="spacingAndGlyphs">Anywhere Work</text>
</svg>
