apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * The version this app ships as, and the build number that tells one build from another.
 *
 * Both are the repository's, not this file's: the released version is the version of the
 * runtime package a tag names (the same tag releases the macOS app, which carries the same
 * pair), and the build number is the git commit count - the same number the macOS bundle
 * puts in CFBundleVersion. A number typed in here would be a second copy of the version,
 * and the second copy is the one that goes stale.
 *
 * `awVersionName` / `awVersionCode` properties (or VERSION_NAME / VERSION_CODE in the
 * environment) override the derivation, which is how a release build is pinned to the tag
 * it is being released as.
 */
def awRepoRoot = file("${project.projectDir}/../../../..")
def awVersionName = {
    def override = project.findProperty('awVersionName') ?: System.getenv('VERSION_NAME')
    if (override) {
        return override.toString()
    }
    def manifest = file("${awRepoRoot}/packages/dsh-web-all/package.json")
    if (!manifest.exists()) {
        throw new GradleException("no released version at ${manifest}; run this from the repository")
    }
    return new groovy.json.JsonSlurper().parse(manifest).version.toString()
}()
// The control plane a fresh install enrolls against, compiled into the APK as
// BuildConfig.AW_MANAGEMENT_URL (read by NetBirdRuntime). The committed default
// comes from config/fleet.json (rendered into the clients by
// scripts/render-fleet-config.mjs), so it is NetBird Cloud unless that file says
// otherwise; a self-hosted deployment passes
// -PawManagementUrl=https://netbird.<its-domain>:443 (or exports
// AW_MANAGEMENT_URL). scripts/publish.sh refuses to publish an APK that does not
// carry the address its channel advertises, because that mismatch ships an
// install nobody can sign in to.
def awFleetConfigFile = file("${awRepoRoot}/config/fleet.json")
if (!awFleetConfigFile.exists()) {
    throw new GradleException("no fleet config at ${awFleetConfigFile}; run scripts/render-fleet-config.mjs")
}
def awManagementUrlFallback = new groovy.json.JsonSlurper().parse(awFleetConfigFile).management.url.toString()
def awManagementUrl = (
        project.findProperty('awManagementUrl')
                ?: System.getenv('AW_MANAGEMENT_URL')
                ?: awManagementUrlFallback
).toString()

def awVersionCode = {
    def override = project.findProperty('awVersionCode') ?: System.getenv('VERSION_CODE')
    if (override) {
        return Integer.parseInt(override.toString())
    }
    // The build number is the git commit count: the same number the macOS bundle puts in
    // CFBundleVersion. It is never guessed - an installed phone compares versionCodes, so a
    // wrong number is how it is told there is nothing to update - which is why a tree
    // without git has to pass -PawVersionCode instead of getting a silent 1.
    def counted = providers.exec {
        commandLine 'git', '-C', awRepoRoot.absolutePath, 'rev-list', '--count', 'HEAD'
        ignoreExitValue = true
    }
    def text = counted.standardOutput.asText.get().trim()
    if (counted.result.get().exitValue != 0 || !(text ==~ /\d+/)) {
        throw new GradleException("the build number could not be derived (git said '${text}'); pass -PawVersionCode=<n>")
    }
    return Integer.parseInt(text)
}()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.netbirdportal"
    // buildConfigField needs the generated BuildConfig this app did not use before.
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.anywherework.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode awVersionCode
        versionName awVersionName
        // Generated rather than written into Kotlin, so the address stays a
        // build input (see awManagementUrl above) and never a source literal.
        buildConfigField "String", "AW_MANAGEMENT_URL", "\"${awManagementUrl}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments clearPackageData: "true"
        ndk {
            // Production target is arm64 (Huawei MIA-AL00 / current Android
            // phones); shipping other ABIs triples the APK for no benefit.
            // -PtargetAbis=x86_64 overrides for the x86_64 acceptance emulator.
            def abis = project.hasProperty('targetAbis')
                    ? project.property('targetAbis').split(',') as List<String>
                    : ["arm64-v8a"]
            abiFilters = abis
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Debug builds expose the acceptance activity so adb/am can drive it.
            manifestPlaceholders = [geckoExported: "true"]
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            manifestPlaceholders = [geckoExported: "false"]
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation(files("libs/netbird-portal.aar"))
    testImplementation("junit:junit:4.13.2")
    // The JVM unit tests exercise the DSH registry, which parses the record and
    // peer JSON the bridge hands over. Android's unit-test android.jar stubs
    // org.json out (every method throws "not mocked"), so the real
    // implementation has to be on the test classpath.
    testImplementation("org.json:json:20180813")
    androidTestImplementation("androidx.test:runner:1.7.0")
    androidTestImplementation("androidx.test.ext:junit:1.3.0")
    implementation("androidx.webkit:webkit:1.15.0")

    // Bundled Firefox engine: deterministic modern kernel independent of the
    // device's system WebView. Multi-ABI artifact; abiFilters keeps only the
    // target ABI's .so in the final APK.
    implementation("org.mozilla.geckoview:geckoview:150.0.20260427013024")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
