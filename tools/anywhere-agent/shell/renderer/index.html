<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:" />
    <title>Anywhere Work</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- One chrome row. There is no address bar and no toolbar: the tab strip is the
         whole of the window's own UI, and the page below it is the service's own. -->
    <header class="tabbar" id="tabbar">
      <div class="traffic" aria-hidden="true"></div>
      <div class="tabs" id="tabs" role="tablist" aria-label="页签"></div>
      <button class="tab-new" id="tab-new" type="button" aria-label="首页" title="首页（⌘T）">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9"/></svg>
      </button>
      <div class="tabbar-fill"></div>
      <button class="ghost" id="open-palette" type="button" aria-label="跳到服务" title="跳到服务（⌘K）">⌘K</button>
      <button class="ghost" id="open-settings" type="button" aria-label="设置" title="设置（⌘,）">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.6v2M8 12.4v2M1.6 8h2M12.4 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M12.5 3.5l-1.4 1.4M4.9 11.1l-1.4 1.4"/></svg>
      </button>
    </header>

    <div class="banner" id="banner" hidden>
      <span class="banner-dot" aria-hidden="true"></span>
      <div class="banner-body">
        <p class="banner-title" id="banner-title"></p>
        <p class="banner-text" id="banner-text"></p>
      </div>
      <div class="banner-actions" id="banner-actions"></div>
    </div>

    <div class="agent-bar" id="agent-bar" hidden>
      <span class="agent-dot" aria-hidden="true"></span>
      <span class="agent-text" id="agent-text">Agent 正在操作这个工作区</span>
      <span class="agent-tier" id="agent-tier">只读</span>
    </div>

    <main class="page" id="page">
      <section class="home" id="home" hidden>
        <div class="home-head">
          <h1>打开服务</h1>
          <p class="home-sub" id="home-sub">都在你的私网里 · 每张卡片开一个页签</p>
          <label class="search">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2 13.5 13.5"/></svg>
            <input id="filter" type="search" placeholder="搜索服务" aria-label="搜索服务" autocomplete="off" spellcheck="false" />
          </label>
        </div>
        <section class="group" id="group-machines">
          <h2>DSH 工作区 <span class="meta" id="machines-meta"></span></h2>
          <div class="grid" id="grid-machines"></div>
        </section>
        <section class="group" id="group-services" hidden>
          <h2>内网系统 <span class="meta" id="services-meta"></span></h2>
          <div class="grid" id="grid-services"></div>
        </section>
        <section class="group empty" id="home-empty" hidden>
          <p id="home-empty-text">还没有可打开的服务</p>
        </section>
        <footer class="home-foot" id="home-foot">
          <span>点卡片即开页签</span><span>已打开的再点 = 切过去</span><span>＋ 回到这里</span><span>⌘W 关闭当前页签</span>
        </footer>
      </section>

      <section class="settings" id="settings" hidden aria-label="设置"></section>
      <section class="message" id="message" hidden></section>
    </main>

    <div class="server-field" id="server-field" hidden>
      <input id="server-input" type="url" inputmode="url" placeholder="https://netbird.example.com:443" aria-label="服务器地址" autocomplete="off" spellcheck="false" />
      <button class="button primary" id="server-save" type="button">保存并登录</button>
      <button class="button" id="server-cancel" type="button">取消</button>
    </div>

    <p class="sr-only" id="live" aria-live="polite"></p>
    <div class="scrim" id="palette-scrim" hidden></div>
    <div class="palette" id="palette" hidden role="dialog" aria-label="跳到服务">
      <input id="palette-input" type="text" placeholder="跳到服务" aria-label="跳到服务" autocomplete="off" spellcheck="false" />
      <div class="palette-list" id="palette-list" role="listbox" aria-label="服务"></div>
    </div>

    <script src="brand.js"></script>
    <script src="view.js"></script>
    <script src="app.js"></script>
  </body>
</html>
